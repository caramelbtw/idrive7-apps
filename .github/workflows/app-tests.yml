name: App tests

# The kit runtime and Readiness's synthetic checks (no SDK, renderer or car needed). The renderer's are in renderd.yml.
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'kit/runtime/**'
      - 'kit/tools/test_*'
      - 'kit/tools/build.py'
      - 'kit/tools/pack_data.py'
      - 'kit/tools/localize.py'
      - '.github/workflows/app-tests.yml'
  push:
    paths:
      - 'apps/**'
      - 'kit/runtime/**'
      - 'kit/tools/test_*'
      - 'kit/tools/build.py'
      - 'kit/tools/pack_data.py'
      - 'kit/tools/localize.py'
      - '.github/workflows/app-tests.yml'

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node kit/tools/test_runtime.js
      - run: node kit/tools/test_dids.js
      - run: node kit/tools/test_engine.js
      - run: node kit/tools/test_diag_options.js
      - run: node kit/tools/test_readiness.js
      - run: python3 kit/tools/build.py --preview-only readiness
      - run: python3 kit/tools/test_fit_to_unit.py
      - run: python3 kit/tools/test_id8_ui.py

  # The head unit runs Node 8.16.2, so code that only works on newer Node passes the job above and fails in the car.
  node8-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '8.16.2'
      - run: node --version
      - run: node kit/tools/test_readiness.js
